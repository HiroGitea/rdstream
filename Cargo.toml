[package]
name = "rdstream"
version = "0.1.0"
authors = ["Hiro"]
edition = "2024"
rust-version = "1.88"
description = "Streaming reader for R .rds and .RData files with selective loading and extraction"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/HiroGitea/rdstream"
documentation = "https://docs.rs/rdstream"
keywords = ["r", "rds", "rdata", "seurat", "streaming"]
categories = ["parser-implementations", "science", "command-line-utilities"]
# Third-party test fixtures and their test remain in the repository.
exclude = ["tests/fixtures", "tests/fixtures.rs", ".github"]

[workspace]
members = ["python"]

[features]
default = ["parallel-gzip"]
# Parallel gzip decoding with memory-aware worker allocation.
parallel-gzip = ["dep:rapidgzip-core", "dep:rusty-rapidgzip", "dep:crossbeam-channel"]

[dependencies]
anyhow = "1.0.104"
bytemuck = "1.25.2"
bzip2 = "0.6.1"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = { version = "0.5", optional = true }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
liblzma = { version = "0.4.8", features = ["static"] }
rapidgzip-core = { version = "0.3.1", optional = true }
rusty-rapidgzip = { version = "0.2.1", optional = true }
serde_json = "1.0.154"
thiserror = "2.0.21"
zstd = { version = "0.14.2", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1

# Tests compress and decompress tens of megabytes; optimize the codecs.
[profile.test.package."*"]
opt-level = 3
